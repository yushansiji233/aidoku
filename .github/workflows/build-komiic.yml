name: Build Komiic.cc Aidoku source

on:
  push:
    branches: [main]
    paths:
      - 'komiic-cc/**'
      - '.github/workflows/build-komiic.yml'
      - 'scripts/package_komiic.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aidoku-source-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Build source
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path komiic-cc/Cargo.toml
      - name: Package and add to list
        run: python3 scripts/package_komiic.py
      - name: Commit built source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.min.json sources/ icons/
          git diff --cached --quiet || (git commit -m 'Build Komiic.cc source' && git push)

